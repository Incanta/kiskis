name: build and publish container image

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch: {}

# Avoid stacking duplicate runs when pushing rapidly to the same ref.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up QEMU (for arm64 cross-build)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      # Asks Komodo to redeploy this service, then waits for the result so a
      # failed deploy fails this run. Goes through Cloudflare Access with a
      # service token. Only runs for main, since that's what updates `latest`.
      # Skipped until the KOMODO_URL secret is set.
      - name: Deploy with Komodo
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          KOMODO_URL: ${{ secrets.KOMODO_URL }}
          KOMODO_STACK: ${{ vars.KOMODO_STACK }}
          # JSON list of compose services to redeploy; [] redeploys the whole stack.
          KOMODO_SERVICES: '["kiskis"]'
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          KOMODO_API_KEY: ${{ secrets.KOMODO_API_KEY }}
          KOMODO_API_SECRET: ${{ secrets.KOMODO_API_SECRET }}
        run: |
          set -euo pipefail

          # A secret, not a variable, so the hostname is masked in logs. `if:` can't
          # read secrets, so the "not set up yet" check lives here.
          if [ -z "${KOMODO_URL:-}" ]; then
            echo "KOMODO_URL secret not set, skipping deploy"
            exit 0
          fi

          api() {
            curl --silent --show-error --fail-with-body --max-time 60 \
              -X POST "${KOMODO_URL%/}/$1" \
              -H "Content-Type: application/json" \
              -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
              -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
              -H "X-Api-Key: $KOMODO_API_KEY" \
              -H "X-Api-Secret: $KOMODO_API_SECRET" \
              --data "$2"
          }

          body=$(jq -nc --arg stack "$KOMODO_STACK" --argjson services "$KOMODO_SERVICES" \
            '{stack: $stack, services: $services}')
          update=$(api execute/DeployStack "$body")

          id=$(jq -r '(.id // (._id | if type == "object" then ."$oid" else . end)) // empty' <<<"$update")
          if [ -z "$id" ]; then
            echo "::warning::Komodo accepted the deploy but returned no update id to follow:"
            echo "$update"
            exit 0
          fi
          echo "Komodo update $id started"

          for _ in $(seq 1 60); do
            sleep 10
            update=$(api read/GetUpdate "$(jq -nc --arg id "$id" '{id: $id}')")
            done=$(jq -r 'if .status == "Complete" or (.end_ts // 0) > 0 then "yes" else "no" end' <<<"$update")
            [ "$done" = yes ] || continue
            if [ "$(jq -r '.success' <<<"$update")" = true ]; then
              echo "Deploy succeeded"
              exit 0
            fi
            echo "::error::Komodo deploy failed"
            jq -r '.logs[]? | "--- \(.stage // "")\n\(.stdout // "")\n\(.stderr // "")"' <<<"$update"
            exit 1
          done

          echo "::error::Timed out after 10 minutes waiting for Komodo update $id"
          exit 1
